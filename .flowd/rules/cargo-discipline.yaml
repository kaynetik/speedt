- id: cargo-no-build
  scope: "**"
  level: warn
  description: |
    Use `cargo check` (or `cargo check -p <crate>`) for agent-driven
    feedback loops. `cargo build` is wall-clock expensive; reserve it
    for explicit user request or a release step.

    The rules engine cannot inspect shell command arguments
    (ProposedAction carries no command string), so this rule fires on
    any shell-class tool invocation as advisory guidance surfaced via
    `rules_list`. The agent is responsible for honoring the constraint
    in the actual command it runs.
  match: "^(Bash|shell|shell_exec|run_command|run_terminal_cmd)$"

- id: cargo-prefer-nextest
  scope: "**"
  level: warn
  description: |
    Prefer `cargo nextest run -p <crate>` over plain `cargo test` for
    dev-loop verification. Nextest's per-test process isolation surfaces
    flakes earlier and parallelises better than libtest, and its
    `-p <crate>` flag still scopes to the crate under test rather than
    the whole workspace (`cargo test --workspace` is reserved for
    pre-commit / CI).

    Prerequisite: `cargo install cargo-nextest --locked`. If nextest
    is not installed, fall back to `cargo test -p <crate>` -- the
    crate-scoping point still stands.

    Same engine caveat as `cargo-no-build`: the rules engine cannot
    inspect command strings, so this is advisory guidance surfaced via
    `rules_list`, not a hard gate.
  match: "^(Bash|shell|shell_exec|run_command|run_terminal_cmd)$"
